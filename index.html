<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeSeek - Tu Buscador y Reproductor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
        }
        body.light {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--card-bg); padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.25rem; color: var(--accent); display: flex; align-items: center; gap: 0.5rem; }
        .container { padding: 1rem; max-width: 800px; margin: 0 auto; width: 100%; flex: 1; padding-bottom: 5rem; }
        .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        input, select { flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-color); font-size: 1rem; }
        button { background: var(--accent); color: white; border: none; padding: 0.75rem 1rem; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: var(--accent-hover); }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        .anime-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .anime-card img { width: 100%; height: 180px; object-fit: cover; }
        .anime-info { padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
        .anime-title { font-size: 0.9rem; font-weight: bold; }
        .anime-meta { font-size: 0.75rem; opacity: 0.8; }
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 0.75rem; }
        nav button { background: none; color: var(--text-color); font-size: 0.8rem; border: none; }
        nav button.active { color: var(--accent); }
        .player-container { background: var(--card-bg); border-radius: 12px; padding: 1rem; border: 1px solid var(--border); margin-top: 1rem; }
        video { width: 100%; border-radius: 8px; background: black; max-height: 300px; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ AnimeSeek</h1>
        <button onclick="toggleTheme()">💡 Modo</button>
    </header>

    <div class="container" id="main-container">
        <!-- Vista Explorar -->
        <div id="view-explore">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Busca Death Note, Naruto, Frieren..." oninput="filterAnime()">
                <button onclick="filterAnime()">Buscar</button>
            </div>
            <div class="anime-grid" id="animeGrid"></div>
        </div>

        <!-- Vista Reproductor / Detalle -->
        <div id="view-player" style="display:none;">
            <button onclick="switchView('explore')" style="margin-bottom: 1rem;">← Volver al buscador</button>
            <div class="player-container">
                <h2 id="playerTitle">Título del Anime</h2>
                <p id="playerEpInfo" style="margin: 0.5rem 0; font-size: 0.9rem;">Episodio 1</p>
                <video id="videoPlayer" controls>
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    Tu navegador no soporta video.
                </video>
                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button onclick="changeEpisode(-1)">Anterior</button>
                    <button onclick="changeEpisode(1)">Siguiente Cap.</button>
                </div>
            </div>
        </div>

        <!-- Vista Progreso / Almacenamiento -->
        <div id="view-stats" style="display:none;">
            <h2>📊 Almacenamiento y Progreso</h2>
            <div class="player-container" style="margin-top: 1rem;">
                <p><strong>Total de Capítulos Vistos:</strong> <span id="statCaps">0</span></p>
                <p><strong>Tiempo Invertido:</strong> <span id="statTime">0 minutos</span></p>
                <p><strong>Memoria Local (Celular):</strong> <span id="statStorage">Activa (localStorage)</span></p>
                <button onclick="resetData()" style="background: #ef4444; margin-top: 1rem;">Limpiar Memoria</button>
            </div>
        </div>
    </div>

    <nav>
        <button id="nav-explore" class="active" onclick="switchView('explore')">📺 Explorar</button>
        <button id="nav-stats" onclick="switchView('stats')">📊 Mi Progreso</button>
    </nav>

    <script>
        const animes = [
            { id: 1, title: "Death Note", eps: 37, genre: "Seinen", img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300" },
            { id: 2, title: "Naruto", eps: 220, genre: "Shonen", img: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=300" },
            { id: 3, title: "Frieren", eps: 28, genre: "Fantasía", img: "https://images.unsplash.com/photo-1618336753974-aae8e04506aa?w=300" },
            { id: 4, title: "Hunter x Hunter", eps: 148, genre: "Shonen", img: "https://images.unsplash.com/photo-1563089145-599997674d42?w=300" }
        ];

        let currentAnime = null;
        let currentEp = 1;
        let stats = JSON.parse(localStorage.getItem('animeseek_stats')) || { caps: 0, minutes: 0 };

        function renderGrid(list) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = list.map(a => `
                <div class="anime-card" onclick="openPlayer(${a.id})">
                    <img src="${a.img}" alt="${a.title}">
                    <div class="anime-info">
                        <div class="anime-title">${a.title}</div>
                        <div class="anime-meta">${a.genre} • ${a.eps} Eps</div>
                        <button style="padding: 0.4rem; font-size: 0.8rem;">Ver Aquí</button>
                    </div>
                </div>
            `).join('');
        }

        function filterAnime() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = animes.filter(a => a.title.toLowerCase().includes(query) || a.genre.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        function openPlayer(id) {
            currentAnime = animes.find(a => a.id === id);
            currentEp = 1;
            document.getElementById('playerTitle').innerText = currentAnime.title;
            document.getElementById('playerEpInfo').innerText = `Reproduciendo Episodio ${currentEp} de ${currentAnime.eps}`;
            switchView('player');
        }

        function changeEpisode(dir) {
            if (!currentAnime) return;
            currentEp += dir;
            if (currentEp < 1) currentEp = 1;
            if (currentEp > currentAnime.eps) currentEp = currentAnime.eps;
            
            document.getElementById('playerEpInfo').innerText = `Reproduciendo Episodio ${currentEp} de ${currentAnime.eps}`;
            
            // Guardar en almacenamiento local
            stats.caps += 1;
            stats.minutes += 24; // 24 min por capítulo aprox
            localStorage.setItem('animeseek_stats', JSON.stringify(stats));
            updateStatsView();
        }

        function switchView(view) {
            document.getElementById('view-explore').style.display = view === 'explore' ? 'block' : 'none';
            document.getElementById('view-player').style.display = view === 'player' ? 'block' : 'none';
            document.getElementById('view-stats').style.display = view === 'stats' ? 'block' : 'none';
            
            document.getElementById('nav-explore').classList.toggle('active', view === 'explore');
            document.getElementById('nav-stats').classList.toggle('active', view === 'stats');
            if(view === 'stats') updateStatsView();
        }

        function updateStatsView() {
            document.getElementById('statCaps').innerText = stats.caps;
            document.getElementById('statTime').innerText = `${stats.minutes} minutos (${(stats.minutes/60).toFixed(1)} horas)`;
        }

        function resetData() {
            stats = { caps: 0, minutes: 0 };
            localStorage.removeItem('animeseek_stats');
            updateStatsView();
            alert("Memoria local restablecida.");
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
        }

        // Inicializar
        renderGrid(animes);
        updateStatsView();
    </script>
</body>
</html>
