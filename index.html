<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeSeek</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #6366f1;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; }
        header { background: var(--card); padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.2rem; color: var(--accent); }
        .container { padding: 1rem; max-width: 600px; margin: 0 auto; }
        .search { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        input { flex: 1; padding: 0.7rem; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none; }
        button { background: var(--accent); color: white; border: none; padding: 0.7rem 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .card { background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); padding: 0.8rem; display: flex; flex-direction: column; gap: 0.5rem; cursor: pointer; }
        .card h3 { font-size: 0.95rem; }
        .card p { font-size: 0.8rem; opacity: 0.8; }
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 0.8rem; z-index: 10; }
        nav button { background: none; color: var(--text); font-size: 0.9rem; border: none; cursor: pointer; }
        .player-box { background: var(--card); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); margin-top: 1rem; text-align: center; }
        video { width: 100%; border-radius: 6px; background: black; max-height: 250px; margin: 0.5rem 0; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ AnimeSeek</h1>
        <button onclick="alert('Almacenamiento local activo en tu celular.')">📱 Info</button>
    </header>

    <div class="container" id="view-home">
        <div class="search">
            <input type="text" id="q" placeholder="Busca anime..." oninput="buscar()">
            <button onclick="buscar()">Buscar</button>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <div class="container" id="view-player" style="display:none;">
        <button onclick="irHome()" style="margin-bottom: 1rem;">← Volver</button>
        <div class="player-box">
            <h2 id="pTitle">Título</h2>
            <p id="pEp">Episodio 1</p>
            <video id="vid" controls>
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                Tu navegador no soporta video.
            </video>
            <div style="display:flex; justify-content:center; gap:0.5rem; margin-top:0.5rem;">
                <button onclick="cambiarEp(-1)">Anterior</button>
                <button onclick="cambiarEp(1)">Siguiente Cap.</button>
            </div>
        </div>
    </div>

    <nav>
        <button onclick="irHome()">🏠 Explorar</button>
        <button onclick="verStats()">📊 Progreso</button>
    </nav>

    <script>
        const lista = [
            { id: 1, title: "Death Note", eps: 37, genre: "Seinen" },
            { id: 2, title: "Naruto", eps: 220, genre: "Shonen" },
            { id: 3, title: "Frieren", eps: 28, genre: "Fantasía" },
            { id: 4, title: "Hunter x Hunter", eps: 148, genre: "Shonen" }
        ];

        let actual = null;
        let epActual = 1;
        let datos = JSON.parse(localStorage.getItem('as_data')) || { caps: 0, mins: 0 };

        function render(arr) {
            const grid = document.getElementById('grid');
            if (!grid) return;
            grid.innerHTML = arr.map(a => `
                <div class="card" onclick="reproducir(${a.id})">
                    <h3>${a.title}</h3>
                    <p>${a.genre} • ${a.eps} Eps</p>
                    <button style="font-size:0.8rem; padding:0.4rem; pointer-events: none;">Ver Capítulos</button>
                </div>
            `).join('');
        }

        function buscar() {
            const inputVal = document.getElementById('q').value.toLowerCase();
            const filtrados = lista.filter(x => x.title.toLowerCase().includes(inputVal) || x.genre.toLowerCase().includes(inputVal));
            render(filtrados);
        }

        function reproducir(id) {
            actual = lista.find(x => x.id === id);
            epActual = 1;
            document.getElementById('pTitle').innerText = actual.title;
            document.getElementById('pEp').innerText = `Episodio ${epActual} de ${actual.eps}`;
            document.getElementById('view-home').style.display = 'none';
            document.getElementById('view-player').style.display = 'block';
        }

        function cambiarEp(dir) {
            if (!actual) return;
            epActual += dir;
            if (epActual < 1) epActual = 1;
            if (epActual > actual.eps) epActual = actual.eps;
            document.getElementById('pEp').innerText = `Episodio ${epActual} de ${actual.eps}`;
            
            datos.caps += 1;
            datos.mins += 24;
            localStorage.setItem('as_data', JSON.stringify(datos));
        }

        function irHome() {
            document.getElementById('view-home').style.display = 'block';
            document.getElementById('view-player').style.display = 'none';
        }

        function verStats() {
            alert(`📊 Tu Progreso en el Celular:\n- Capítulos vistos: ${datos.caps}\n- Tiempo invertido: ${datos.mins} minutos`);
        }

        // Forzar la ejecución inmediata al cargar el script por completo
        render(lista);
    </script>
</body>
</html>
